[pytest]
testpaths =
    test_content_service.py
    test_image_service.py
    test_products.py
    tests/test_llm.py
    p0_acceptance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .venv .git __pycache__ .pytest_cache
asyncio_default_fixture_loop_scope = function
