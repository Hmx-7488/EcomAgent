[pytest]
testpaths =
    backend/test_content_service.py
    backend/test_image_service.py
    backend/test_products.py
    backend/tests/test_llm.py
    backend/p0_acceptance
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .venv backend/.venv .git __pycache__ .pytest_cache
asyncio_default_fixture_loop_scope = function
