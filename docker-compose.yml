services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomagent-postgres
    environment:
      POSTGRES_DB: ecomagent
      POSTGRES_USER: ecomagent
      POSTGRES_PASSWORD: ecomagent_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ecomagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomagent -d ecomagent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ecomagent_postgres_data:
